<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Site</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #020617, #0f172a, #1d4ed8);
      color: white;
    }

    nav {
      display: flex;
      gap: 12px;
      padding: 16px;
      background: rgba(0,0,0,0.35);
      position: sticky;
      top: 0;
      backdrop-filter: blur(8px);
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
    }

    main {
      padding: 40px 20px;
      max-width: 900px;
      margin: auto;
    }

    section {
      margin-bottom: 28px;
      padding: 24px;
      border-radius: 16px;
      background: rgba(0,0,0,0.25);
    }

    h1, h2 {
      margin-bottom: 12px;
    }

    p {
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#home">Home</a>
    <a href="#commands">Commands</a>
    <a href="#privacy">Privacy Policy</a>
    <a href="#tos">TOS</a>
  </nav>

  <main>
    <section id="home">
      <h1>Home</h1>
      <p>Welcome to the site.</p>
    </section>

    <section id="commands">
      <h2>Commands</h2>
      <p>Add your commands here.</p>
    </section>

    <section id="privacy">
      <h2>Privacy Policy</h2>
      <p>Put your privacy policy here.</p>
    </section>

    <section id="tos">
      <h2>Terms of Service</h2>
      <p>Put your TOS here.</p>
    </section>
  </main>
</body>
</html>
